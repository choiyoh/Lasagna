packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  electron: true
  # 13.x 는 플랫폼별 .node 를 패키지에 담아 보낸다(prebuilds/). 소스 빌드(node-gyp)는 필요 없고, Windows 에서 Visual Studio 없이도 설치되게 끈다.
  better-sqlite3: false
  '@parcel/watcher': true
  macos-alias: true
  fs-xattr: true
  electron-winstaller: true
minimumReleaseAgeExclude:
  - '@oh-new-editor/core'
# Electron Forge는 pnpm에서 hoisted 레이아웃을 요구한다.
nodeLinker: hoisted
