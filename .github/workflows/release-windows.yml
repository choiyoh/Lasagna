name: release-windows

# 공개 릴리스에 Windows 설치 파일(.exe·.nupkg·RELEASES·휴대용 zip)을 자동으로 만들어 첨부한다.
# 수동 실행(workflow_dispatch)은 이미 게시된 릴리스의 태그를 입력해 같은 일을 한다.
# 서명 인증서가 없어 SmartScreen 경고가 나올 수 있다(릴리스 노트에 안내).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '빌드해 첨부할 릴리스 태그(예: v0.14.1)'
        required: true
        type: string
  # PR 검증용: 이 워크플로 파일이 바뀐 PR 에서만 빌드·아티팩트 업로드까지 확인한다.
  # 머지 전에 이 트리거를 제거한다(릴리스 첨부 단계는 PR 에서 실행되지 않는다).
  pull_request:
    paths:
      - '.github/workflows/release-windows.yml'

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      # 같은 릴리스에 파일을 첨부할 때만 쓰기 권한이 필요하다(그 외 단계는 읽기).
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release tag
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Windows installers
        run: pnpm --filter @nopsidian/desktop make
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lasagna-windows-${{ env.RELEASE_TAG || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/out/make/squirrel.windows/**/*.exe
            apps/desktop/out/make/squirrel.windows/**/*.nupkg
            apps/desktop/out/make/squirrel.windows/**/RELEASES
            apps/desktop/out/make/zip/win32/**/*.zip
      - name: Attach to release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName >/dev/null
          mapfile -t files < <(find apps/desktop/out/make -type f \
            \( -name '*.exe' -o -name '*.nupkg' -o -name 'RELEASES' -o -name '*.zip' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "첨부할 설치 파일이 없습니다." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
