packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  electron: true
  # 13.x 는 플랫폼별 .node 를 패키지에 담아 보낸다(prebuilds/). 소스 빌드(node-gyp)는 필요 없고, Windows 에서 Visual Studio 없이도 설치되게 끈다.
  better-sqlite3: false
  '@parcel/watcher': true
  macos-alias: true
  fs-xattr: true
  electron-winstaller: true
minimumReleaseAgeExclude:
  - '@oh-new-editor/core'
overrides:
  # GHSA-238p-pmpm-9mq7(katex <0.18.2) — remark-math>micromark-extension-math 가 katex ^0.16.0 을 고정하고 있어
  # 직접 의존성만 올리면 취약한 사본이 남는다. 쓰는 API 가 renderToString 뿐이라 0.19.x 로 맞춘다.
  katex: ^0.19.0
  # DOMPurify 3.4.17 에서 수정된 critical/high/low(Mermaid·에디터가 함께 쓰는 사본) 를 하나로 고정한다.
  dompurify: ^3.4.17
# Electron Forge는 pnpm에서 hoisted 레이아웃을 요구한다.
nodeLinker: hoisted
