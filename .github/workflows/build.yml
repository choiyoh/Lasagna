name: build

# GitHub 에서는 설치 파일을 만들지 않는다(빌드 결과물은 각 PC 에서 만들어 구글 드라이브 `AI Works/Nopsidian/빌드` 에 둔다).
# 여기서는 가장 싼 Linux 에서 린트·타입·테스트만 돌린다. 세 OS 전체 테스트가 필요하면 Actions 탭에서 수동 실행(all-os).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all-os:
        description: 'Windows·macOS 에서도 테스트(분량을 많이 쓴다)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r test

  test-all-os:
    if: github.event_name == 'workflow_dispatch' && inputs.all-os
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test
