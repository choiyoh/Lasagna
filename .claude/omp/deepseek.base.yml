# Claude Code 보조 에이전트(DeepSeek)용 OMP 설정 덧씌우기(overlay).
# `omp --config <이 파일>`로 이번 실행에만 적용되며, ~/.omp/agent/config.yml 은 건드리지 않는다.
#
# 핵심 원칙: 실패해도 다른 모델로 몰래 바꾸지 않는다.
modelRoles:
  # 이 실행이 쓸 수 있는 모델 역할을 전부 같은 DeepSeek V4.1 Flash로 고정한다.
  # (세션 제목 생성, 서브작업 등이 smol/slow/plan 역할을 쓰면서 다른 모델로 새는 것을 막는다)
  default: commandcode/deepseek/deepseek-v4.1-flash
  smol: commandcode/deepseek/deepseek-v4.1-flash
  slow: commandcode/deepseek/deepseek-v4.1-flash
  plan: commandcode/deepseek/deepseek-v4.1-flash
retry:
  # 같은 모델로의 일시적 재시도(네트워크 오류 등)는 허용하되 횟수를 줄이고, 모델 교체는 끈다.
  modelFallback: false
  fallbackChains: {}
  maxRetries: 2
memory:
  backend: off
